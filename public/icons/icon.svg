<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#12121a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27273a" stroke-width="2" />

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Symbol "m³" stylized -->
  <g transform="translate(48, 60)">
    <!-- Letter 'm' modern geometry -->
    <path d="M 80 290 L 80 160 C 80 135 100 115 125 115 C 150 115 170 135 170 160 L 170 290" fill="none" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 170 160 C 170 135 190 115 215 115 C 240 115 260 135 260 160 L 260 290" fill="none" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Exponent '3' modern badge -->
    <g transform="translate(290, 80)">
      <circle cx="48" cy="48" r="44" fill="#181824" stroke="#34d399" stroke-width="6" />
      <path d="M 34 32 C 34 32 46 24 58 32 C 68 40 60 50 48 52 C 62 54 70 66 58 74 C 46 82 34 74 34 74" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
